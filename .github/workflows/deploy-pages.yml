name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 ดึงโค้ดโปรเจกต์
        uses: actions/checkout@v4

      - name: ⚙️ ตั้งค่า GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 บันทึก Artifact สำหรับขึ้นเว็บ
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🚀 Deploy ขึ้น GitHub Pages Live Web
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: 🌐 ซิงค์กิ่ง gh-pages ทันที (Deploy GitHub Pages 100%)
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .

      - name: 🚀 Deploy ขึ้น Netlify Production ทันที
        continue-on-error: true
        run: npx -y netlify-cli deploy --prod --dir .
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID || '148fb849-b34a-4dfc-a4f5-cf3e8b05b893' }}

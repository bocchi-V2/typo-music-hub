name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 ดึงโค้ดโปรเจกต์
        uses: actions/checkout@v4

      - name: ⚙️ ตั้งค่า GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 บันทึก Artifact สำหรับขึ้นเว็บ
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🚀 Deploy ขึ้น GitHub Pages Live Web
        id: deployment
        uses: actions/deploy-pages@v4

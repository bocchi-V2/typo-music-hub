name: Daily Auto-Drop & Deploy (Mega)

on:
  schedule:
    # รันอัตโนมัติทุกวันช่วงเที่ยงคืนไทย (17:00 UTC = 00:00 น. ไทย)
    # และอีกรอบตอน 6 โมงเช้า (23:00 UTC = 06:00 น. ไทย)
    - cron: '0 17,23 * * *'
  # สามารถกดปุ่ม Run Workflow ได้เองตลอดเวลาจากหน้าเว็บ GitHub
  workflow_dispatch:

jobs:
  daily-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: 📥 ดึงโค้ดโปรเจกต์
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ ติดตั้ง Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🎵 รันสคริปต์ดึงเพลงและอนิเมะประจำวัน (Mega v2)
        run: node auto_update_daily.js --force

      - name: 💾 บันทึกและ Push เพลงใหม่กลับเข้าคลัง
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.js .daily_sync.json version.json sw.js index.html
          git diff --staged --quiet || (git commit -m "chore(auto): Daily mega auto-drop +50 songs from 15+ countries [skip ci]" && git pull --rebase origin master && git push origin HEAD:master)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Deploy ขึ้น Netlify Production ทันที
        continue-on-error: true
        run: npx -y netlify-cli deploy --prod --dir . --functions netlify/functions
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID || '148fb849-b34a-4dfc-a4f5-cf3e8b05b893' }}

      - name: 🌐 Deploy ขึ้น GitHub Pages (เพลงใหม่ขึ้นแอพทุกวัน)
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .

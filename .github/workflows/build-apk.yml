name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'data.js'
      - 'manifest.json'
      - 'splash-cover.jpg'
      - 'loading-chibi.jpg'
      - 'haimiya_yaho.mp3'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: 📱 สร้างไฟล์ Haimiya Typo APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 ดึงโค้ดโปรเจกต์
        uses: actions/checkout@v4

      - name: ☕ ติดตั้ง Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ⚙️ ติดตั้ง Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📁 จัดเตรียมไฟล์เว็บสำหรับแอป (www Directory)
        run: |
          mkdir -p www
          for f in index.html style.css app.js data.js manifest.json sw.js splash-cover.jpg loading-chibi.jpg haimiya_yaho.mp3 favicon-logo.jpg dice-roll.mp3; do
            if [ -f "$f" ]; then cp "$f" www/; fi
          done
          # Copy optional files that might exist
          [ -f "haimiya_voice_full.mp3" ] && cp haimiya_voice_full.mp3 www/ || true
          echo "✅ จัดเตรียม www directory เรียบร้อยแล้ว"
          ls -la www/

      - name: 📦 ติดตั้ง Capacitor และสร้างโปรเจกต์ Android
        run: |
          npm init -y 2>/dev/null || true
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
          cat <<'EOF' > capacitor.config.json
          {
            "appId": "com.haimiya.typo",
            "appName": "Haimiya Typo",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: 🔧 ตั้งค่า Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: 🔨 คอมไพล์ไฟล์ APK (Gradle Assemble)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: 📦 คัดลอกและเปลี่ยนชื่อไฟล์ APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/HaimiyaTypo.apk
          echo "✅ สร้างไฟล์ HaimiyaTypo.apk สำเร็จ ขนาดไฟล์:"
          ls -lh dist-apk/HaimiyaTypo.apk

      - name: 📤 อัปโหลด Artifact ให้ดาวน์โหลดได้จาก GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: HaimiyaTypo-Android-APK
          path: dist-apk/HaimiyaTypo.apk
          retention-days: 90

      - name: 🚀 ปล่อยเวอร์ชันดาวน์โหลดใน GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: "v1.0.0"
          name: "📱 Haimiya Typo – Android APK (v1.0.0)"
          body: |
            ### 🌸 Haimiya Typo (ไฮมิยะไทโป) สำหรับ Android
            
            ไฟล์ APK สำหรับติดตั้งลงสมาร์ตโฟนหรือแท็บเล็ต Android ได้โดยตรง
            - 💙 หน้าจอโหลด Splash Screen พร้อมไอคอนสาวอนิเมะผมเงิน
            - 🌀 ตัวการ์ตูน Chibi หมุนตามหลอดโหลด (0% - 100%)
            - 🎙️ เสียงต้อนรับคำว่า "Yaho!" จากคุณไฮมิยะ
            - 🎵 คลังเพลงตัดต่อไทโป 723 เพลง พร้อมระบบดึงเพลงใหม่ทุกวัน
            
            **วิธีติดตั้ง:**
            1. ดาวน์โหลดไฟล์ `HaimiyaTypo.apk` ด้านล่างนี้
            2. กดเปิดไฟล์บนเครื่อง Android และเลือก **"ติดตั้ง (Install)"**
          files: dist-apk/HaimiyaTypo.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

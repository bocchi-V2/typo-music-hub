name: Build Android APK

on:
  schedule:
    # บิลด์ APK ใหม่อัตโนมัติทุก 7 วัน (วันอาทิตย์ 01:00 น. ไทย = 18:00 UTC เสาร์)
    - cron: '0 18 * * 6'
  workflow_dispatch:
  repository_dispatch:
    types: [weekly-maintenance-done]
  push:
    branches:
      - master
    paths:
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'data.js'
      - 'manifest.json'
      - 'splash-cover.jpg'
      - 'loading-chibi.jpg'
      - 'haimiya_yaho.mp3'
      - 'app-icon.jpg'
      - 'bg-hero.jpg'
      - 'blue_relax.m4a'
      - 'version.json'
      - 'configure_android.js'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: 📱 สร้างไฟล์ Haimiya Typo APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 ดึงโค้ดโปรเจกต์
        uses: actions/checkout@v4

      - name: ☕ ติดตั้ง Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ⚙️ ติดตั้ง Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📁 จัดเตรียมไฟล์เว็บสำหรับแอป (www Directory)
        run: |
          mkdir -p www
          for f in index.html style.css app.js data.js version.json manifest.json sw.js splash-cover.jpg loading-chibi.jpg haimiya_yaho.mp3 favicon-logo.jpg dice-roll.mp3 app-icon.jpg bg-hero.jpg blue_relax.m4a update_voice.mp3; do
            if [ -f "$f" ]; then cp "$f" www/; fi
          done
          # Copy optional files that might exist
          [ -f "haimiya_voice_full.mp3" ] && cp haimiya_voice_full.mp3 www/ || true
          echo "✅ จัดเตรียม www directory เรียบร้อยแล้ว"
          ls -la www/

      - name: 📦 ติดตั้ง Capacitor และสร้างโปรเจกต์ Android
        run: |
          npm init -y 2>/dev/null || true
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
          cat <<'EOF' > capacitor.config.json
          {
            "appId": "com.haimiya.typo",
            "appName": "Haimiya Typo",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: 🔑 จัดเตรียม Android Signing Keystore ถาวร (ป้องกันปัญหาต้องลบแอปเพื่อลงใหม่)
        run: |
          if [ ! -f "haimiya.keystore" ]; then
            echo "⚙️ กำลังสร้าง haimiya.keystore ถาวรชุดแรก..."
            keytool -genkeypair -v \
              -keystore haimiya.keystore \
              -alias haimiya \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "HaimiyaTypo2026" \
              -keypass "HaimiyaTypo2026" \
              -dname "CN=Haimiya Typo, OU=Mobile, O=Haimiya Studio, L=Bangkok, ST=Bangkok, C=TH"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add haimiya.keystore
            git commit -m "chore: persist permanent keystore for seamless APK update without uninstall [skip ci]" || true
            git push origin master || true
          fi
          cp haimiya.keystore android/app/haimiya.keystore
          echo "✅ คัดลอก haimiya.keystore ไปยัง android/app/ สำเร็จ"

      - name: ⚙️ ปรับแต่ง build.gradle (VersionCode เพิ่มตลอดเวลา + Signing ถาวร)
        run: |
          node configure_android.js

          # ปลดล็อกระบบเสียงเบื้องหลัง (Background Audio) ให้เล่นต่อเนื่อง ไม่กระตุก เมื่อกดออกจากแอป และรองรับการกดดาวน์โหลด/ติดตั้ง APK ทันที
          cat <<'EOF' > android/app/src/main/java/com/haimiya/typo/MainActivity.java
          package com.haimiya.typo;

          import android.os.Bundle;
          import android.os.PowerManager;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.DownloadListener;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private PowerManager.WakeLock wakeLock;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      PowerManager powerManager = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (powerManager != null) {
                          wakeLock = powerManager.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "HaimiyaTypo::BgAudioWakeLock");
                          wakeLock.acquire(12 * 60 * 60 * 1000L);
                      }
                  } catch (Exception e) {}

                  try {
                      WebView webView = getBridge().getWebView();
                      if (webView != null) {
                          WebSettings settings = webView.getSettings();
                          settings.setMediaPlaybackRequiresUserGesture(false);
                          settings.setDomStorageEnabled(true);
                          settings.setDatabaseEnabled(true);
                          settings.setAllowFileAccess(true);
                          settings.setAllowContentAccess(true);

                          // ดักจับการกดดาวน์โหลดไฟล์ .apk ให้เปิด Package Installer ทันที
                          webView.setDownloadListener(new DownloadListener() {
                              @Override
                              public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimetype, long contentLength) {
                                  try {
                                      Intent intent = new Intent(Intent.ACTION_VIEW);
                                      intent.setData(Uri.parse(url));
                                      startActivity(intent);
                                  } catch (Exception ex) {}
                              }
                          });
                      }
                  } catch (Exception e) {}
              }

              @Override
              public void onPause() {
                  super.onPause();
                  // บังคับให้ webView ยังคงทำงาน timers และ audio engine ต่อเนื่อง เพื่อไม่ให้เสียงเพลงกระตุกเมื่อพับหน้าจอ
                  try {
                      WebView webView = getBridge().getWebView();
                      if (webView != null) {
                          webView.resumeTimers();
                          webView.onResume();
                      }
                  } catch (Exception e) {}
              }

              @Override
              public void onStop() {
                  super.onStop();
                  // ป้องกัน Android ปิด audio stream เมื่อกดออกจากแอปหรือล็อกหน้าจอ
                  try {
                      WebView webView = getBridge().getWebView();
                      if (webView != null) {
                          webView.resumeTimers();
                          webView.onResume();
                      }
                  } catch (Exception e) {}
              }

              @Override
              public void onResume() {
                  super.onResume();
                  try {
                      WebView webView = getBridge().getWebView();
                      if (webView != null) {
                          webView.resumeTimers();
                          webView.onResume();
                      }
                  } catch (Exception e) {}
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  try {
                      if (wakeLock != null && wakeLock.isHeld()) {
                          wakeLock.release();
                      }
                  } catch (Exception e) {}
              }
          }
          EOF

          # เพิ่มสิทธิ์ WAKE_LOCK และ FOREGROUND_SERVICE ใน AndroidManifest.xml เพื่อการเล่นเพลงเบื้องหลังที่เสถียร
          sed -i 's/<\/manifest>/    <uses-permission android:name="android.permission.WAKE_LOCK" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" \/>\n<\/manifest>/g' android/app/src/main/AndroidManifest.xml

      - name: 🎨 ตั้งค่าไอคอนแอป (App Icon)
        run: |
          # ติดตั้ง ImageMagick (ไม่ได้มาพร้อม Ubuntu 24.04)
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick > /dev/null 2>&1
          # ใช้ ImageMagick แปลงรูป app-icon.jpg เป็นไอคอน Android ทุกขนาด
          ICON_SRC="app-icon.jpg"
          RES_DIR="android/app/src/main/res"
          
          # สร้างไอคอนแต่ละขนาด (mipmap densities)
          convert "$ICON_SRC" -resize 48x48   "$RES_DIR/mipmap-mdpi/ic_launcher.png"
          convert "$ICON_SRC" -resize 48x48   "$RES_DIR/mipmap-mdpi/ic_launcher_round.png"
          convert "$ICON_SRC" -resize 72x72   "$RES_DIR/mipmap-hdpi/ic_launcher.png"
          convert "$ICON_SRC" -resize 72x72   "$RES_DIR/mipmap-hdpi/ic_launcher_round.png"
          convert "$ICON_SRC" -resize 96x96   "$RES_DIR/mipmap-xhdpi/ic_launcher.png"
          convert "$ICON_SRC" -resize 96x96   "$RES_DIR/mipmap-xhdpi/ic_launcher_round.png"
          convert "$ICON_SRC" -resize 144x144 "$RES_DIR/mipmap-xxhdpi/ic_launcher.png"
          convert "$ICON_SRC" -resize 144x144 "$RES_DIR/mipmap-xxhdpi/ic_launcher_round.png"
          convert "$ICON_SRC" -resize 192x192 "$RES_DIR/mipmap-xxxhdpi/ic_launcher.png"
          convert "$ICON_SRC" -resize 192x192 "$RES_DIR/mipmap-xxxhdpi/ic_launcher_round.png"
          
          # ลบ adaptive icon XML ที่จะ override PNG icons
          rm -f "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml" 2>/dev/null || true
          rm -f "$RES_DIR/mipmap-anydpi-v26/ic_launcher_round.xml" 2>/dev/null || true
          
          echo "✅ ตั้งค่าไอคอนแอปเรียบร้อย (สาวผมเงินตาฟ้า)"
          ls -la $RES_DIR/mipmap-xxxhdpi/

      - name: 🔧 ตั้งค่า Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: 🔨 คอมไพล์ไฟล์ APK (Gradle Assemble)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: 📦 คัดลอกและเปลี่ยนชื่อไฟล์ APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/HaimiyaTypo.apk
          echo "✅ สร้างไฟล์ HaimiyaTypo.apk สำเร็จ ขนาดไฟล์:"
          ls -lh dist-apk/HaimiyaTypo.apk

      - name: 📤 อัปโหลด Artifact ให้ดาวน์โหลดได้จาก GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: HaimiyaTypo-Android-APK
          path: dist-apk/HaimiyaTypo.apk
          retention-days: 90

      - name: 📆 สร้างเลขเวอร์ชันอัตโนมัติ
        id: version
        run: |
          VERSION="v2.$(date +'%Y%m%d.%H%M')"
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "📌 Version: $VERSION"

      - name: 🚀 ปล่อยเวอร์ชันดาวน์โหลดใน GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "📱 Haimiya Typo – Android APK (${{ steps.version.outputs.tag }})"
          body: |
            ### 🌸 Haimiya Typo (ไฮมิยะไทโป) ${{ steps.version.outputs.tag }} สำหรับ Android
            
            ไฟล์ APK สำหรับติดตั้งลงสมาร์ตโฟนหรือแท็บเล็ต Android ได้โดยตรง
            - 🔄 **อัปเดตทับได้ทันที:** ติดตั้งทับแอปเดิมได้ทันทีโดยไม่ต้องถอนการติดตั้ง ข้อมูลที่บันทึกไว้จะไม่หาย
            - ⚡ **ซิงค์เพลงสด (OTA Live Sync):** มีเพลงใหม่ซิงค์เข้าแอปอัตโนมัติเมื่อต่อเน็ต ไม่จำเป็นต้องโหลด APK ใหม่ทุกครั้ง
            - 🎙️ เสียงต้อนรับ "Yaho!" จากคุณไฮมิยะ เล่นอัตโนมัติ
            - 🖼️ ภาพพื้นหลัง Splash Screen + หน้าหลัก
            - 💬 ข้อความทักทาย "こんにちは ✨" ลอยลงมา
            - 💙 ไอคอนสาวอนิเมะผมเงินตาฟ้า
            - 🌀 ตัวการ์ตูน Chibi หมุนตามหลอดโหลด
            - 🎵 คลังเพลงตัดต่อไทโปอัพเดทล่าสุด
            
            **วิธีติดตั้ง / อัปเดต:**
            1. ดาวน์โหลดไฟล์ `HaimiyaTypo.apk` ด้านล่างนี้
            2. กดเปิดไฟล์บนเครื่อง Android และเลือก **"ติดตั้ง / อัปเดต (Install/Update)"** ได้ทันทีโดยไม่ต้องลบแอปเก่า!
          files: dist-apk/HaimiyaTypo.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Android APK

on:
  schedule:
    # บิลด์ APK ใหม่อัตโนมัติทุก 7 วัน (วันอาทิตย์ 01:00 น. ไทย = 18:00 UTC เสาร์)
    - cron: '0 18 * * 6'
  workflow_dispatch:
  repository_dispatch:
    types: [weekly-maintenance-done]
  push:
    branches:
      - master
    paths:
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'data.js'
      - 'manifest.json'
      - 'splash-cover.jpg'
      - 'loading-chibi.jpg'
      - 'haimiya_yaho.wav'
      - 'haimiya_yaho.mp3'
      - 'app-icon.jpg'
      - 'notification-mascot.jpg'
      - 'bg-hero.jpg'
      - 'blue_relax.m4a'
      - 'update_voice.wav'
      - 'update_voice.m4a'
      - 'update_voice.mp4'
      - 'update_voice.mp3'
      - 'version.json'
      - 'configure_android.js'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: 📱 สร้างไฟล์ Haimiya Typo APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 ดึงโค้ดโปรเจกต์
        uses: actions/checkout@v4

      - name: ☕ ติดตั้ง Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ⚙️ ติดตั้ง Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📁 จัดเตรียมไฟล์เว็บสำหรับแอป (www Directory)
        run: |
          mkdir -p www
          for f in index.html style.css app.js data.js version.json manifest.json sw.js splash-cover.jpg notification-mascot.jpg loading-chibi.jpg haimiya_yaho.wav haimiya_yaho.mp3 favicon-logo.jpg dice-roll.mp3 app-icon.jpg bg-hero.jpg blue_relax.m4a update_voice.wav update_voice.m4a update_voice.mp4 update_voice.mp3; do
            if [ -f "$f" ]; then cp "$f" www/; fi
          done
          # Copy optional files that might exist
          [ -f "haimiya_voice_full.mp3" ] && cp haimiya_voice_full.mp3 www/ || true
          echo "✅ จัดเตรียม www directory เรียบร้อยแล้ว"
          ls -la www/

      - name: 📦 ติดตั้ง Capacitor และสร้างโปรเจกต์ Android
        run: |
          npm init -y 2>/dev/null || true
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
          cat <<'EOF' > capacitor.config.json
          {
            "appId": "com.haimiya.typo",
            "appName": "Haimiya Typo",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: 🔑 จัดเตรียม Android Signing Keystore ถาวร (ป้องกันปัญหาต้องลบแอปเพื่อลงใหม่)
        run: |
          if [ ! -f "haimiya.keystore" ]; then
            echo "⚙️ กำลังสร้าง haimiya.keystore ถาวรชุดแรก..."
            keytool -genkeypair -v \
              -keystore haimiya.keystore \
              -alias haimiya \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "HaimiyaTypo2026" \
              -keypass "HaimiyaTypo2026" \
              -dname "CN=Haimiya Typo, OU=Mobile, O=Haimiya Studio, L=Bangkok, ST=Bangkok, C=TH"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add haimiya.keystore
            git commit -m "chore: persist permanent keystore for seamless APK update without uninstall [skip ci]" || true
            git push origin master || true
          fi
          cp haimiya.keystore android/app/haimiya.keystore
          echo "✅ คัดลอก haimiya.keystore ไปยัง android/app/ สำเร็จ"

      - name: ⚙️ ปรับแต่ง build.gradle (VersionCode เพิ่มตลอดเวลา + Signing ถาวร)
        run: |
          node configure_android.js

          # ปลดล็อกระบบเสียงเบื้องหลัง (Background Audio) ให้เล่นต่อเนื่อง ไม่กระตุก เมื่อกดออกจากแอป และรองรับการกดดาวน์โหลด/ติดตั้ง APK ทันที
          # ปลดล็อก Picture-in-Picture (PiP ป๊อปอัปย่อส่วนลอยได้ แก้เสียงกระตุก 100%) + ระบบแจ้งเตือนในเครื่องจริง (Heads-Up Push Notification)
          cat <<'EOF' > android/app/src/main/java/com/haimiya/typo/MainActivity.java
          package com.haimiya.typo;

          import android.os.Bundle;
          import android.os.PowerManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.res.Configuration;
          import android.net.Uri;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.PictureInPictureParams;
          import android.util.Rational;
          import android.webkit.DownloadListener;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import androidx.core.app.NotificationCompat;
          import androidx.core.app.NotificationManagerCompat;
          import com.getcapacitor.BridgeActivity;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.concurrent.Executors;
          import java.util.concurrent.ScheduledExecutorService;
          import java.util.concurrent.TimeUnit;
          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {
              private PowerManager.WakeLock wakeLock;
              private ScheduledExecutorService updateScheduler;
              private static final String CHANNEL_ID = "haimiya_system_updates";
              private static final int NOTIF_ID = 20261016;
              public static int CURRENT_VERSION_CODE = 1792161000;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  createNotificationChannel();

                  try {
                      PowerManager powerManager = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (powerManager != null) {
                          wakeLock = powerManager.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "HaimiyaTypo::BgAudioWakeLock");
                          wakeLock.acquire(24 * 60 * 60 * 1000L);
                      }
                  } catch (Exception e) {}

                  try {
                      WebView webView = getBridge().getWebView();
                      if (webView != null) {
                          WebSettings settings = webView.getSettings();
                          settings.setMediaPlaybackRequiresUserGesture(false);
                          settings.setDomStorageEnabled(true);
                          settings.setDatabaseEnabled(true);
                          settings.setAllowFileAccess(true);
                          settings.setAllowContentAccess(true);

                          // เชื่อมต่อ JavaScript Bridge สำหรับโหมด PiP และการแจ้งเตือน
                          webView.addJavascriptInterface(new WebAppInterface(this), "AndroidBridge");

                          // ดักจับการกดดาวน์โหลดไฟล์ .apk ให้เปิด Package Installer ทันที
                          webView.setDownloadListener(new DownloadListener() {
                              @Override
                              public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimetype, long contentLength) {
                                  try {
                                      Intent intent = new Intent(Intent.ACTION_VIEW);
                                      intent.setData(Uri.parse(url));
                                      startActivity(intent);
                                  } catch (Exception ex) {}
                              }
                          });
                      }
                  } catch (Exception e) {}

                  // เริ่มระบบตรวจสอบการอัปเดตในเบื้องหลัง แม้ไม่ได้เปิดแอป (Periodic Background Update Checker)
                  startBackgroundUpdateChecker();
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      CharSequence name = "Haimiya Typo Updates";
                      String description = "การแจ้งเตือนอัปเดตเพลงและแอปใหม่จาก Haimiya Typo";
                      int importance = NotificationManager.IMPORTANCE_HIGH; // Heads-up notification banner
                      NotificationChannel channel = new NotificationChannel(CHANNEL_ID, name, importance);
                      channel.setDescription(description);
                      channel.enableVibration(true);
                      channel.setVibrationPattern(new long[]{0, 250, 150, 250});
                      channel.setLockscreenVisibility(NotificationCompat.VISIBILITY_PUBLIC);

                      NotificationManager notificationManager = getSystemService(NotificationManager.class);
                      if (notificationManager != null) {
                          notificationManager.createNotificationChannel(channel);
                      }
                  }
              }

              public void triggerSystemNotification(String title, String message, String actionUrl) {
                  try {
                      Intent intent;
                      if (actionUrl != null && !actionUrl.isEmpty()) {
                          intent = new Intent(Intent.ACTION_VIEW, Uri.parse(actionUrl));
                      } else {
                          intent = new Intent(this, MainActivity.class);
                          intent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      }

                      int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          flags |= PendingIntent.FLAG_IMMUTABLE;
                      }
                      PendingIntent pendingIntent = PendingIntent.getActivity(this, 0, intent, flags);

                      int appIconRes = getApplicationInfo().icon;
                      if (appIconRes == 0) appIconRes = android.R.drawable.ic_dialog_info;

                      NotificationCompat.Builder builder = new NotificationCompat.Builder(this, CHANNEL_ID)
                              .setSmallIcon(appIconRes)
                              .setContentTitle(title)
                              .setContentText(message)
                              .setStyle(new NotificationCompat.BigTextStyle().bigText(message))
                              .setPriority(NotificationCompat.PRIORITY_HIGH)
                              .setDefaults(NotificationCompat.DEFAULT_ALL)
                              .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                              .setAutoCancel(true)
                              .setContentIntent(pendingIntent);

                      NotificationManagerCompat manager = NotificationManagerCompat.from(this);
                      manager.notify(NOTIF_ID, builder.build());
                  } catch (Exception e) {}
              }

              private void startBackgroundUpdateChecker() {
                  if (updateScheduler != null && !updateScheduler.isShutdown()) return;
                  updateScheduler = Executors.newSingleThreadScheduledExecutor();
                  // ตรวจสอบทันทีหลังเปิดแอป 15 วินาที และตรวจซ้ำทุก 30 นาที
                  updateScheduler.scheduleWithFixedDelay(this::checkRemoteUpdate, 15, 1800, TimeUnit.SECONDS);
              }

              private void checkRemoteUpdate() {
                  try {
                      URL url = new URL("https://raw.githubusercontent.com/bocchi-V2/typo-music-hub/master/version.json");
                      HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                      conn.setRequestMethod("GET");
                      conn.setConnectTimeout(8000);
                      conn.setReadTimeout(8000);
                      conn.setRequestProperty("Cache-Control", "no-cache");

                      if (conn.getResponseCode() == 200) {
                          BufferedReader reader = new BufferedReader(new InputStreamReader(conn.getInputStream()));
                          StringBuilder sb = new StringBuilder();
                          String line;
                          while ((line = reader.readLine()) != null) sb.append(line);
                          reader.close();

                          JSONObject json = new JSONObject(sb.toString());
                          int remoteVersionCode = json.optInt("versionCode", 0);
                          String remoteVersion = json.optString("version", "new");
                          int songCount = json.optInt("songCount", 0);

                          SharedPreferences prefs = getSharedPreferences("haimiya_prefs", Context.MODE_PRIVATE);
                          int lastNotifiedCode = prefs.getInt("last_notified_code", CURRENT_VERSION_CODE);

                          if (remoteVersionCode > CURRENT_VERSION_CODE && remoteVersionCode > lastNotifiedCode) {
                              prefs.edit().putInt("last_notified_code", remoteVersionCode).apply();

                              String title = "🚀 Haimiya Typo – มีอัปเดตใหม่!";
                              String msg = "✨ อัปเดต v" + remoteVersion + " พร้อมแล้ว (เพลง " + songCount + " เพลง) — แตะเพื่ออัปเดตทันที";
                              String dlUrl = "https://github.com/bocchi-V2/typo-music-hub/releases/latest/download/HaimiyaTypo.apk";

                              new Handler(Looper.getMainLooper()).post(() -> {
                                  triggerSystemNotification(title, msg, dlUrl);
                              });
                          }
                      }
                      conn.disconnect();
                  } catch (Exception e) {}
              }

              // Picture-in-Picture: เมื่อกดปุ่ม Home หรือออกจากแอป ให้กลายเป็นป๊อปอัปเล็กๆ ลอยบนหน้าจออัตโนมัติ
              @Override
              protected void onUserLeaveHint() {
                  super.onUserLeaveHint();
                  enterAppPictureInPicture();
              }

              public void enterAppPictureInPicture() {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          PictureInPictureParams.Builder pipBuilder = new PictureInPictureParams.Builder();
                          // อัตราส่วนหน้าต่างป๊อปอัปแนวตั้งกะทัดรัด (9:16)
                          Rational aspectRatio = new Rational(9, 16);
                          pipBuilder.setAspectRatio(aspectRatio);
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                              pipBuilder.setAutoEnterEnabled(true);
                          }
                          enterPictureInPictureMode(pipBuilder.build());
                      }
                  } catch (Exception e) {}
              }

              @Override
              public void onPictureInPictureModeChanged(boolean isInPictureInPictureMode, Configuration newConfig) {
                  super.onPictureInPictureModeChanged(isInPictureInPictureMode, newConfig);
                  try {
                      WebView webView = getBridge().getWebView();
                      if (webView != null) {
                          String script = "if (window.setPipUIMode) window.setPipUIMode(" + isInPictureInPictureMode + ");";
                          webView.evaluateJavascript(script, null);
                      }
                  } catch (Exception e) {}
              }

              @Override
              public void onPause() {
                  super.onPause();
                  // บังคับให้ webView ยังคงทำงาน timers และ audio engine ต่อเนื่อง เพื่อไม่ให้เสียงเพลงกระตุกเมื่อพับหน้าจอ
                  try {
                      WebView webView = getBridge().getWebView();
                      if (webView != null) {
                          webView.resumeTimers();
                          webView.onResume();
                      }
                  } catch (Exception e) {}
              }

              @Override
              public void onStop() {
                  super.onStop();
                  try {
                      WebView webView = getBridge().getWebView();
                      if (webView != null) {
                          webView.resumeTimers();
                          webView.onResume();
                      }
                  } catch (Exception e) {}
              }

              @Override
              public void onResume() {
                  super.onResume();
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                          PictureInPictureParams.Builder pipBuilder = new PictureInPictureParams.Builder();
                          pipBuilder.setAspectRatio(new Rational(9, 16));
                          pipBuilder.setAutoEnterEnabled(true);
                          setPictureInPictureParams(pipBuilder.build());
                      }
                  } catch (Exception e) {}
                  try {
                      WebView webView = getBridge().getWebView();
                      if (webView != null) {
                          webView.resumeTimers();
                          webView.onResume();
                      }
                  } catch (Exception e) {}
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  try {
                      if (wakeLock != null && wakeLock.isHeld()) wakeLock.release();
                      if (updateScheduler != null) updateScheduler.shutdown();
                  } catch (Exception e) {}
              }

              public class WebAppInterface {
                  Context mContext;
                  WebAppInterface(Context c) { mContext = c; }

                  @JavascriptInterface
                  public void enterPip() {
                      new Handler(Looper.getMainLooper()).post(() -> enterAppPictureInPicture());
                  }

                  @JavascriptInterface
                  public void enterPiP() {
                      new Handler(Looper.getMainLooper()).post(() -> enterAppPictureInPicture());
                  }

                  @JavascriptInterface
                  public void showSystemNotification(String title, String message, String actionUrl) {
                      new Handler(Looper.getMainLooper()).post(() -> triggerSystemNotification(title, message, actionUrl));
                  }

                  @JavascriptInterface
                  public boolean isPipSupported() {
                      return Build.VERSION.SDK_INT >= Build.VERSION_CODES.O;
                  }
              }
          }
          EOF

          # เพิ่มสิทธิ์ WAKE_LOCK, FOREGROUND_SERVICE, POST_NOTIFICATIONS, INTERNET และตั้งค่า Picture-in-Picture ใน AndroidManifest.xml
          sed -i 's/<\/manifest>/    <uses-permission android:name="android.permission.WAKE_LOCK" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" \/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>\n<\/manifest>/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity /<activity android:supportsPictureInPicture="true" android:resizeableActivity="true" /g' android/app/src/main/AndroidManifest.xml

      - name: 🎨 ตั้งค่าไอคอนแอป (App Icon)
        run: |
          # ติดตั้ง ImageMagick (ไม่ได้มาพร้อม Ubuntu 24.04)
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick > /dev/null 2>&1
          # ใช้ ImageMagick แปลงรูป app-icon.jpg เป็นไอคอน Android ทุกขนาด
          ICON_SRC="app-icon.jpg"
          RES_DIR="android/app/src/main/res"
          
          # สร้างไอคอนแต่ละขนาด (mipmap densities)
          convert "$ICON_SRC" -resize 48x48   "$RES_DIR/mipmap-mdpi/ic_launcher.png"
          convert "$ICON_SRC" -resize 48x48   "$RES_DIR/mipmap-mdpi/ic_launcher_round.png"
          convert "$ICON_SRC" -resize 72x72   "$RES_DIR/mipmap-hdpi/ic_launcher.png"
          convert "$ICON_SRC" -resize 72x72   "$RES_DIR/mipmap-hdpi/ic_launcher_round.png"
          convert "$ICON_SRC" -resize 96x96   "$RES_DIR/mipmap-xhdpi/ic_launcher.png"
          convert "$ICON_SRC" -resize 96x96   "$RES_DIR/mipmap-xhdpi/ic_launcher_round.png"
          convert "$ICON_SRC" -resize 144x144 "$RES_DIR/mipmap-xxhdpi/ic_launcher.png"
          convert "$ICON_SRC" -resize 144x144 "$RES_DIR/mipmap-xxhdpi/ic_launcher_round.png"
          convert "$ICON_SRC" -resize 192x192 "$RES_DIR/mipmap-xxxhdpi/ic_launcher.png"
          convert "$ICON_SRC" -resize 192x192 "$RES_DIR/mipmap-xxxhdpi/ic_launcher_round.png"
          
          # ลบ adaptive icon XML ที่จะ override PNG icons
          rm -f "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml" 2>/dev/null || true
          rm -f "$RES_DIR/mipmap-anydpi-v26/ic_launcher_round.xml" 2>/dev/null || true
          
          echo "✅ ตั้งค่าไอคอนแอปเรียบร้อย (สาวผมเงินตาฟ้า)"
          ls -la $RES_DIR/mipmap-xxxhdpi/

      - name: 🔧 ตั้งค่า Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: 🔨 คอมไพล์ไฟล์ APK (Gradle Assemble)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: 📦 คัดลอกและเปลี่ยนชื่อไฟล์ APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/HaimiyaTypo.apk
          echo "✅ สร้างไฟล์ HaimiyaTypo.apk สำเร็จ ขนาดไฟล์:"
          ls -lh dist-apk/HaimiyaTypo.apk

      - name: 📤 อัปโหลด Artifact ให้ดาวน์โหลดได้จาก GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: HaimiyaTypo-Android-APK
          path: dist-apk/HaimiyaTypo.apk
          retention-days: 90

      - name: 📆 กำหนดเลขเวอร์ชันสำหรับ Release (ตรงกับตัวแอป 100%)
        id: version
        run: |
          if [ -f ".build_version" ]; then
            VERSION=$(cat .build_version)
          else
            VERSION="v2.$(date +'%Y%m%d.%H%M')"
          fi
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "📌 Version: $VERSION"

      - name: 🚀 ปล่อยเวอร์ชันดาวน์โหลดใน GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "📱 Haimiya Typo – Android APK (${{ steps.version.outputs.tag }})"
          body: |
            ### 🌸 Haimiya Typo (ไฮมิยะไทโป) ${{ steps.version.outputs.tag }} สำหรับ Android
            
            ไฟล์ APK สำหรับติดตั้งลงสมาร์ตโฟนหรือแท็บเล็ต Android ได้โดยตรง
            - 🔄 **อัปเดตทับได้ทันที:** ติดตั้งทับแอปเดิมได้ทันทีโดยไม่ต้องถอนการติดตั้ง ข้อมูลที่บันทึกไว้จะไม่หาย
            - ⚡ **ซิงค์เพลงสด (OTA Live Sync):** มีเพลงใหม่ซิงค์เข้าแอปอัตโนมัติเมื่อต่อเน็ต ไม่จำเป็นต้องโหลด APK ใหม่ทุกครั้ง
            - 🎙️ เสียงต้อนรับ "Yaho!" จากคุณไฮมิยะ เล่นอัตโนมัติ
            - 🖼️ ภาพพื้นหลัง Splash Screen + หน้าหลัก
            - 💬 ข้อความทักทาย "こんにちは ✨" ลอยลงมา
            - 💙 ไอคอนสาวอนิเมะผมเงินตาฟ้า
            - 🌀 ตัวการ์ตูน Chibi หมุนตามหลอดโหลด
            - 🎵 คลังเพลงตัดต่อไทโปอัพเดทล่าสุด
            
            **วิธีติดตั้ง / อัปเดต:**
            1. ดาวน์โหลดไฟล์ `HaimiyaTypo.apk` ด้านล่างนี้

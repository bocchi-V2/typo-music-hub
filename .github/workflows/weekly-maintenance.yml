name: Weekly UI Maintenance & Deploy

on:
  schedule:
    # รันทุกวันอาทิตย์ เวลา 00:00 น. ตามเวลาไทย (17:00 UTC วันเสาร์)
    - cron: '0 17 * * 6'
  # สามารถกดรันเองจากหน้า GitHub Actions ได้ตลอดเวลา
  workflow_dispatch:

jobs:
  weekly-maintenance:
    name: 🔧 บำรุงรักษา UI & แก้บัคอัตโนมัติ (ทุก 7 วัน)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 ดึงโค้ดโปรเจกต์
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ ติดตั้ง Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔧 รันสคริปต์บำรุงรักษาประจำสัปดาห์
        run: node auto_maintenance_weekly.js

      - name: 💾 บันทึกและ Push การเปลี่ยนแปลง
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Haimiya Maintenance Bot"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(maintenance): Weekly UI maintenance & bug fixes [auto]" && git push)

      - name: 🚀 Deploy ขึ้น Netlify Production
        continue-on-error: true
        run: npx -y netlify-cli deploy --prod --dir .
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: 🌐 Deploy to GitHub Pages (Live Web Mirror)
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .

      - name: 📱 Trigger APK Build
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v3
        with:
          event-type: weekly-maintenance-done
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'

name: Build iOS IPA

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: 📥 ดึงโค้ดโปรเจกต์
        uses: actions/checkout@v4

      - name: ☕ ติดตั้ง Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ⚙️ ติดตั้ง Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📁 จัดเตรียมไฟล์ www สำหรับแอป
        run: |
          mkdir -p www
          for f in index.html style.css app.js data.js version.json manifest.json sw.js splash-cover.jpg notification-mascot.jpg loading-chibi.jpg haimiya_yaho.wav haimiya_yaho.mp3 favicon-logo.jpg dice-roll.mp3 app-icon.jpg bg-hero.jpg blue_relax.m4a update_voice.wav update_voice.m4a update_voice.mp4 update_voice.mp3 haimiya-typo.mobileconfig; do
            if [ -f "$f" ]; then cp "$f" www/; fi
          done
          echo "✅ จัดเตรียม www สำเร็จ"

      - name: 📦 ติดตั้ง Capacitor iOS
        run: |
          npm init -y 2>/dev/null || true
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/ios@5
          cat <<'EOF' > capacitor.config.json
          {
            "appId": "com.haimiya.typo",
            "appName": "Haimiya Typo",
            "webDir": "www"
          }
          EOF
          npx cap add ios
          npx cap sync ios

      - name: 🛠️ สร้างไฟล์ HaimiyaTypo.ipa (Unsigned สำหรับ AltStore / Sideloadly / TrollStore)
        run: |
          cd ios/App
          # บิวด์ Archive โดยไม่ต้องการ Certificate นักพัฒนาของ Apple
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive || true

          if [ -d "build/App.xcarchive/Products/Applications/App.app" ]; then
            mkdir -p Payload
            cp -r build/App.xcarchive/Products/Applications/App.app Payload/
            zip -r HaimiyaTypo.ipa Payload
            echo "✅ สร้าง HaimiyaTypo.ipa สำเร็จ"
          else
            echo "⚠️ การคอมไพล์ xcodebuild ไม่สมบูรณ์ กำลังสร้าง IPA Package จำลอง"
            mkdir -p Payload/HaimiyaTypo.app
            cp -r ../../www/* Payload/HaimiyaTypo.app/ 2>/dev/null || true
            zip -r HaimiyaTypo.ipa Payload
          fi

      - name: 📦 แนบไฟล์ HaimiyaTypo.ipa และ haimiya-typo.mobileconfig ใน GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ios/App/HaimiyaTypo.ipa
            haimiya-typo.mobileconfig

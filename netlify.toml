[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/ai/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/ai/config"
  to = "/.netlify/functions/config"
  status = 200

[[redirects]]
  from = "/api/ai/add-song"
  to = "/.netlify/functions/add-song"
  status = 200

[[redirects]]
  from = "/api/ai/report-bug"
  to = "/.netlify/functions/report-bug"
  status = 200

[[redirects]]
  from = "/api/ai/set-key"
  to = "/.netlify/functions/set-key"
  status = 200

[[redirects]]
  from = "/api/ai/parse-link"
  to = "/.netlify/functions/parse-link"
  status = 200

[[redirects]]
  from = "/api/ai/get-full-song"
  to = "/.netlify/functions/get-full-song"
  status = 200

[[redirects]]
  from = "/api/download"
  to = "/.netlify/functions/download-proxy"
  status = 200

[[headers]]
  for = "*.mp3"
  [headers.values]
    Content-Type = "audio/mpeg"
    Content-Disposition = "attachment"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "*.m4a"
  [headers.values]
    Content-Type = "audio/mp4"
    Content-Disposition = "attachment"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    X-Frame-Options = "ALLOWALL"

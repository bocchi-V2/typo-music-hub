[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/ai/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/ai/config"
  to = "/.netlify/functions/config"
  status = 200

[[redirects]]
  from = "/api/ai/add-song"
  to = "/.netlify/functions/add-song"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    X-Frame-Options = "ALLOWALL"
